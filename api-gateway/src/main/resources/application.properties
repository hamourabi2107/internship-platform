spring.application.name=api-gateway
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=student-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://student-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/student/**

spring.cloud.gateway.server.webflux.routes[1].id=internship-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://internship-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/internships/**

