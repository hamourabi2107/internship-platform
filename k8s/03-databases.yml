apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: company-db
  template:
    metadata:
      labels:
        app: company-db
    spec:
      containers:
        - name: company-db
          image: mariadb:10.11
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: MARIADB_DATABASE
              value: company_db
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["sh", "-c", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h localhost -u root -proot"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h localhost -u root -proot"]
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: company-db
spec:
  selector:
    app: company-db
  ports:
    - port: 3306
      targetPort: 3306
