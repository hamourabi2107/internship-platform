services:

  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - internship-network

  student-db:
    image: mysql:8.0
    container_name: student-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - student-db-data:/var/lib/mysql
    networks:
      - internship-network

  internship-db:
    image: mysql:8.0
    container_name: internship-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: internship_db
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - internship-db-data:/var/lib/mysql
    networks:
      - internship-network

  company-db:
    image: mariadb:10.11
    container_name: company-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: company_db
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - company-db-data:/var/lib/mysql
    networks:
      - internship-network

  student-service:
    build:
      context: ./student-service
    container_name: student-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://student-db:3306/student_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: student-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
    depends_on:
      student-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - internship-network

  internship-service:
    build:
      context: ./internship-service
    container_name: internship-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://internship-db:3306/internship_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: internship-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
    depends_on:
      internship-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - internship-network

  company-service:
    build:
      context: ./company-service
    container_name: company-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://company-db:3306/company_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: company-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
    depends_on:
      company-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - internship-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
    depends_on:
      eureka-server:
        condition: service_started
      student-service:
        condition: service_started
      internship-service:
        condition: service_started
      company-service:
        condition: service_started
    networks:
      - internship-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - internship-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - internship-network

networks:
  internship-network:
    driver: bridge

volumes:
  student-db-data:
  internship-db-data:
  company-db-data: